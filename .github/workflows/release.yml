name: Publish local workstation update
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- tests/launcher.test.mjs
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node scripts/package-runtime.mjs
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
      - run: node scripts/test-runtime-bootstrap.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: release/runtime/*
          retention-days: 1
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: runtime
    runs-on: ubuntu-latest
    env:
      RELEASE_NOTES: |
        更新下载新增真实进度条、百分比、已下载大小、传输速度和预计剩余时间。
        明确显示连接、下载、校验、解压和运行依赖准备阶段；网络停滞时提示等待，连续 60 秒未收到数据可重试。
        更新在后台子进程处理，可关闭窗口继续使用；保留模型一键推荐与密钥创建指引。
        首次使用请下载对应系统的 studio-full 完整包，解压后双击 Windows-启动.bat 或 Mac-启动.command，无需手动安装 Node.js。
        已安装用户可在工作台版本面板检查更新；本地数据和密钥保留。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- tests/api-session.test.ts tests/canvas-autosave.test.ts tests/canvas.test.ts tests/update-manager.test.mjs tests/update-progress.test.ts tests/update-policy.test.ts tests/update-supervisor.test.mjs tests/launcher.test.mjs tests/model-setup.test.ts tests/relays.test.ts tests/token01-routing.test.ts tests/relay-catalog.test.ts
      - run: npm run build
      - run: node scripts/release-update.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: release/update
          merge-multiple: true
      - name: Build complete download packages
        run: python3 scripts/package-full.py release/update
      - name: Publish version JSON and application archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/update/* --verify-tag --notes "$RELEASE_NOTES" --generate-notes
