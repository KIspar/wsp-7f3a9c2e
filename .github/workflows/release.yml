name: Publish local workstation update
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_NOTES: |
    新电脑请下载对应系统的 studio-full 完整离线包，包内包含 Node.js 和核心依赖，首次启动无需联网下载环境。
    Windows x64 支持双击 Windows-启动.bat；macOS 请区分 Intel 和 Apple 芯片，双击 Mac-启动.command。
    修复入口先检查并复用可用环境，不再强制重新下载；也可识别本机已有的兼容 Node.js。
    Windows、macOS 和 Linux 完整包均经过原生环境离线准备、修复及服务启动验证后发布。
    保留真实更新下载进度和模型一键推荐；作品、数据库和 API 密钥保存在本机，不包含在发布包中。
    可选 Python 本地视频处理工具与语音识别模型尚未包含；在线模型生成和版本更新仍需联网。
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- tests/api-session.test.ts tests/canvas-autosave.test.ts tests/canvas.test.ts tests/update-manager.test.mjs tests/update-progress.test.ts tests/update-policy.test.ts tests/update-supervisor.test.mjs tests/launcher.test.mjs tests/model-setup.test.ts tests/relays.test.ts tests/token01-routing.test.ts tests/relay-catalog.test.ts
      - run: npm run build
      - run: node scripts/release-update.mjs
        env:
          GITHUB_REF_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-update
          path: release/update/*
          retention-days: 1
  runtime:
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- tests/launcher.test.mjs
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node scripts/package-runtime.mjs
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
      - run: node scripts/test-runtime-bootstrap.mjs
      - uses: actions/download-artifact@v4
        with:
          name: app-update
          path: release/runtime
      - name: Build complete native package
        run: python scripts/package-full.py release/runtime --platform ${{ matrix.platform }}
      - name: Verify complete package without system Node or dependency downloads
        run: node scripts/test-full-package.mjs release/runtime/studio-full-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            release/runtime/studio-runtime-*
            release/runtime/studio-full-*
          compression-level: 0
          retention-days: 1
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-update
          path: release/update
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: release/update
          merge-multiple: true
      - name: Publish verified version JSON and offline packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/update/* --verify-tag --notes "$RELEASE_NOTES" --generate-notes
