<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>抖音采集助手</title><link rel="stylesheet" href="popup.css"><body><h1>抖音采集助手</h1><p>先在当前浏览器登录抖音网页版，再检查并采集。</p><section><label for="origin">本地工作台地址</label><input id="origin" value="http://127.0.0.1:4310"><label for="code">工作台配对码</label><input id="code" placeholder="输入五分钟内有效的配对码"><button id="pair">配对工作台</button></section><section><label for="jobs">待采集素材</label><select id="jobs"></select><button id="refresh">刷新任务</button><button id="open">打开该素材</button></section><div id="state" role="status">尚未检查登录状态</div><section class="actions"><button id="login">打开抖音登录</button><button id="check">检查当前页登录</button><button id="start" disabled>开始／继续采集</button><button id="pause">暂停采集</button><button id="supplement">补采当前商品首屏</button></section><p>一级评论最多100条，采集到二级；遇到登录提醒会暂停。采集不自动调用付费分析。</p><script src="popup.js"></script></body></html>
